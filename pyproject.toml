[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "supportpilot-ai"
version = "0.1.0"
description = "Production-oriented NLP system for customer support intent classification."
requires-python = ">=3.11,<3.13"

dependencies = [
    "torch>=2.12,<2.13",
    "transformers>=5.15,<5.16",
    "safetensors>=0.8,<0.9",
    "fastapi>=0.141,<0.142",
    "pydantic>=2.13,<3",
    "uvicorn>=0.52,<0.53",
]


[project.optional-dependencies]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=9.1,<10",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"