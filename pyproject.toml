[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "supportpilot-ai"
version = "0.1.0"
description = "Production-oriented NLP system for customer support intent classification."
requires-python = ">=3.11,<3.13"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"